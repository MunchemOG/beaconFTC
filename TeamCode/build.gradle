apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // Beacon native core + JNI shim (src/main/cpp/CMakeLists.txt pulls in ../beacon-native).
    // NDK 27 / CMake 3.22.1 from the Android SDK; arm64-v8a only (beacon-native's OpenCV and
    // Ceres are prebuilt for that ABI only). The core is always built optimized, also in debug
    // APKs, because an -O0 vision core would be far too slow on the Control Hub.
    ndkVersion '27.0.12077973'
    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                abiFilters 'arm64-v8a'
                targets 'beacon_jni', 'beacon'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Desktop fusion replay (ReplayFusionTest): forward -Pbeacon.replay.* to the test JVM, e.g.
    // ./gradlew :TeamCode:testDebugUnitTest --offline --tests '*ReplayFusionTest*' -Pbeacon.replay.run=DIR
    testOptions {
        unitTests.all { t ->
            ['beacon.replay.run', 'beacon.replay.fixes', 'beacon.replay.out',
             'beacon.replay.fixDelayMs', 'beacon.replay.config'].each { k ->
                if (project.hasProperty(k)) {
                    t.systemProperty k, project.property(k)
                }
            }
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // JVM unit tests (./gradlew :TeamCode:testDebugUnitTest). The android.jar used for these
    // tests is a stub whose methods throw, so Beacon's pure-Java code (including its JSON
    // parser) deliberately avoids android.* and org.json.
    testImplementation 'junit:junit:4.13.2'
}
